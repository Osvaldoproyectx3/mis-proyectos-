<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Mis Proyectos</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#111613">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Proyectos">
<meta name="mobile-web-app-capable" content="yes">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>window.supabase || document.write('<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"><\/script>');</script>
<style>html,body{margin:0;background:#E4E7E2}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior-y:none}button,input,select,textarea{font-family:inherit}</style>
</head>
<body>
<script>
  /* Pega aquí tu Project URL y tu llave publishable de Supabase.
     Si lo dejas vacío, la app te pedirá los datos la primera vez. */
  window.__SUPABASE_CONFIG__ = {
    url: "",
    key: "",
  };
</script>
<div id="root"><div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#111613;font-family:-apple-system,Arial,sans-serif"><svg viewBox="0 0 100 100" width="96" height="96"><polygon points="50,6 88,28 50,50 12,28" fill="#F2B33D"/><polygon points="12,28 50,50 50,94 12,72" fill="#4CAF6E"/><polygon points="88,28 88,72 50,94 50,50" fill="#9AA3B2"/></svg><div style="color:#fff;font-size:30px;font-weight:800">Mis Proyectos</div><div style="color:#9AA3B2;font-size:14px">Cargando Mis Proyectos…</div></div></div>
<script>
window.addEventListener('error', function (e) {
  var r = document.getElementById('root');
  if (r && r.textContent.indexOf('Cargando Mis Proyectos') >= 0) r.innerHTML = '<div style="padding:24px;font-family:-apple-system,Arial,sans-serif;color:#334155"><h2 style="margin:0 0 8px">No se pudo abrir la app</h2><p>' + String(e.message || 'Error').replace(/</g, '&lt;') + '</p><p>Cierra la página y ábrela de nuevo. Si sigue igual, envíame una captura de este mensaje.</p></div>';
});
window.addEventListener('load', function () {
  setTimeout(function () {
    var r = document.getElementById('root');
    if (r && r.textContent.indexOf('Cargando Mis Proyectos') >= 0) r.innerHTML = '<div style="padding:24px;font-family:-apple-system,Arial,sans-serif;color:#334155"><h2 style="margin:0 0 8px">La app no terminó de cargar</h2><p>' + (window.supabase ? 'Revisa tu conexión a internet y recarga la página.' : 'No se pudo descargar una librería (Supabase). Revisa tu conexión a internet o desactiva el bloqueador de contenido y recarga.') + '</p></div>';
  }, 6000);
});
</script>
<script>
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
</script>
