<script>
// Abre siempre la versión más reciente: busca app-proyectos.html, app-proyectos-1.html, -2, -3… y carga la de número más alto.
(async function(){
  var CLAVE='mp-ultima-version', BASE='./', MAX=80, MANIFEST='<link rel="manifest" href="./abrir-manifest.json">';
  function mostrar(html){
    html=html.replace(/<link[^>]*rel=["']manifest["'][^>]*>/i,'');
    html=html.replace(/<head([^>]*)>/i,'<head$1>'+MANIFEST);
    document.open(); document.write(html); document.close();
  }
  function cache(){ try{ return localStorage.getItem(CLAVE); }catch(e){ return null; } }
  try{
    var nombres=['app-proyectos.html'], i; for(i=1;i<=MAX;i++) nombres.push('app-proyectos-'+i+'.html');
    var r=await Promise.all(nombres.map(function(n){ return fetch(BASE+n+'?t='+Date.now(),{method:'HEAD',cache:'no-store'}).then(function(x){return x.ok;}).catch(function(){return false;}); }));
    var mejor=-1; r.forEach(function(ok,k){ if(ok) mejor=k; });
    if(mejor<0) throw new Error('sin versiones');
    var res=await fetch(BASE+nombres[mejor]+'?t='+Date.now(),{cache:'no-store'}); if(!res.ok) throw new Error('http '+res.status);
    var html=await res.text();
    try{ localStorage.setItem(CLAVE,html); }catch(e){}
    mostrar(html);
  }catch(e){
    var guardada=cache();
    if(guardada){ mostrar(guardada); }
    else document.getElementById('t').textContent='No se pudo abrir. Revisa tu internet e inténtalo otra vez.';
  }
})();
</script></body></html>
